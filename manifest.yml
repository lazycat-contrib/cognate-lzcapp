application:
  subdomain: cognate
  background_task: true
  multi_instance: false
  oidc_redirect_path: /auth/oidc/callback
  public_path:
    - /
  routes:
    - /=exec://8080,/lzcapp/pkg/content/run.sh
  environment:
    - {{ printf "%q" (printf "COGNATE_BOOTSTRAP_ADMIN_USERNAME=%s" .U.admin_username) }}
    - {{ printf "%q" (printf "COGNATE_BOOTSTRAP_ADMIN_PASSWORD=%s" .U.admin_password) }}
    - {{ printf "%q" (printf "COGNATE_ADMIN_USER_IDS=%s" .U.admin_user_ids) }}
    - {{ printf "%q" (printf "COGNATE_LAZYCAT_OIDC_ENABLED=%v" .U.enable_oidc) }}
    - {{ printf "%q" (printf "COGNATE_GITHUB_CLIENT_ID=%s" .U.github_client_id) }}
    - LAZYCAT_APP_DOMAIN=${LAZYCAT_APP_DOMAIN}
    - LAZYCAT_AUTH_OIDC_ISSUER_URI=${LAZYCAT_AUTH_OIDC_ISSUER_URI}
    - LAZYCAT_AUTH_OIDC_CLIENT_ID=${LAZYCAT_AUTH_OIDC_CLIENT_ID}
    - LAZYCAT_AUTH_OIDC_CLIENT_SECRET=${LAZYCAT_AUTH_OIDC_CLIENT_SECRET}
