application:
  subdomain: cognate
  background_task: true
  multi_instance: false
  oidc_redirect_path: /auth/oidc/callback
  public_path:
    - /
  routes:
    - /=exec://8080,/lzcapp/pkg/content/run.sh
  environment:
    - COGNATE_BOOTSTRAP_ADMIN_USERNAME_BASE64={{ .U.admin_username | b64enc }}
    - COGNATE_BOOTSTRAP_ADMIN_PASSWORD_BASE64={{ .U.admin_password | b64enc }}
    - COGNATE_ADMIN_USER_IDS_BASE64={{ .U.admin_user_ids | b64enc }}
    - COGNATE_LAZYCAT_OIDC_ENABLED={{ .U.enable_oidc }}
    - COGNATE_GITHUB_CLIENT_ID_BASE64={{ .U.github_client_id | b64enc }}
    - LAZYCAT_APP_DOMAIN=${LAZYCAT_APP_DOMAIN}
    - LAZYCAT_AUTH_OIDC_ISSUER_URI=${LAZYCAT_AUTH_OIDC_ISSUER_URI}
    - LAZYCAT_AUTH_OIDC_CLIENT_ID=${LAZYCAT_AUTH_OIDC_CLIENT_ID}
    - LAZYCAT_AUTH_OIDC_CLIENT_SECRET=${LAZYCAT_AUTH_OIDC_CLIENT_SECRET}
