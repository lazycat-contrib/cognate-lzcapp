version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/cognate.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git
build:
  toolchains:
    - kind: go
      version: 1.27.3
    - kind: node
      version: 26.12.0
  run_buildscript: true
release:
  use_github_release_notes: false
  store_changelog_format: plain
  changelog_template: 'Cognate {{.Version}}：新增不含密钥内容的启动存储诊断，定位懒猫设备上的密钥校验失败；密钥不存在时自动生成，已有密钥不覆盖。保留首次管理员、OIDC 等安装向导。设备故障仍在定位，不声称已修复；完整备份恢复和配置自动应用尚未完成。'
images: []
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Cognate
    summary: Skill 聚合、分发与同步服务（预览版）
