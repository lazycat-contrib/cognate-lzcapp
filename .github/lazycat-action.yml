version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/cognate.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git
build:
  toolchains:
    - kind: go
      version: 1.27.3
    - kind: node
      version: 26.12.0
  run_buildscript: true
release:
  use_github_release_notes: false
  store_changelog_format: plain
  changelog_template: 'Cognate {{.Version}}：适配 root 运行的应用私有持久卷，仅收紧 /lzcapp/var 权限，解决已复现的 0777 祖先目录启动拒绝。显式传递数据和密钥路径，由服务端为新实例生成密钥，已有密钥与管理员密码不覆盖，已有数据丢密钥拒绝重建。新增隔离启动及升级门禁；真机安装仍待验证。完整备份恢复和配置自动应用尚未完成。'
images: []
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Cognate
    summary: Skill 聚合、分发与同步服务（预览版）
