version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/cognate.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git
build:
  toolchains:
    - kind: go
      version: 1.27.3
    - kind: node
      version: 26.12.0
  run_buildscript: true
release:
  use_github_release_notes: false
  store_changelog_format: plain
  changelog_template: 'Cognate {{.Version}}：更新至服务端 0.2.0，增加固定 Gemini profile 的配置授权与 Linux 离线归档校验，修正合法空 WAL 索引的备份检查，补齐 Gemini 许可材料。沿用原管理员密码、主密钥和私有数据目录；完整恢复、全 agent/Pack 自动应用及平台 OIDC、真机升级验收仍待完成。仅喵喵商店分发，官方商店关闭。'
images: []
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Cognate
    summary: Skill 聚合、分发与同步服务
