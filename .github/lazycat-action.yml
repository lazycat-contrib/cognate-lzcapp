version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/cognate.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git
build:
  toolchains:
    - kind: go
      version: 1.27.3
    - kind: node
      version: 26.12.0
  run_buildscript: true
release:
  use_github_release_notes: false
  store_changelog_format: plain
  changelog_template: 'Cognate {{.Version}} 正式分发：提供内嵌 Web 的 Skill 聚合、分发与同步服务，保留本地账号、显式 OIDC 绑定和应用私有持久卷，沿用已有管理员密码与主密钥。正式分发已有能力不等于全产品完成；完整备份恢复、全 agent/Pack 自动应用及跨平台验收仍待完成，平台 OIDC 与真机升级仍待验证。仅喵喵商店分发，官方商店关闭。'
images: []
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Cognate
    summary: Skill 聚合、分发与同步服务
