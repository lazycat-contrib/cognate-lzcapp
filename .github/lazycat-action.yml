version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/cognate.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git
build:
  toolchains:
    - kind: go
      version: 1.27.3
    - kind: node
      version: 26.12.0
  run_buildscript: true
release:
  use_github_release_notes: false
  store_changelog_format: plain
  changelog_template: 'Cognate {{.Version}}：优化 Web 工作空间、导航与切页反馈；仓库列表优先展示，添加弹层保留草稿，Magpie/cc-switch/npx 导入按需展开；AI 配置支持 Agent/名称筛选。沿用 0.4.0 的 OIDC 关联、加密导出与数据库兼容，不修改设备配置。升级保留原管理员、密码、主密钥和数据目录；真机升级待验证。仅喵喵商店，官方关闭。'
images: []
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Cognate
    summary: Skill 聚合、分发与同步服务
