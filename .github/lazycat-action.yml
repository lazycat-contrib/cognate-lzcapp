version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/cognate.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git
build:
  toolchains:
    - kind: go
      version: 1.27.3
    - kind: node
      version: 26.12.0
  run_buildscript: true
release:
  use_github_release_notes: false
  store_changelog_format: plain
  changelog_template: 'Cognate {{.Version}}：导入支持按来源与客户端筛选，重复提示合并、技术详情按需展开，修复 cc-switch 大库预览与确认后提交失败。管理员可在后台启停备份、设置自动周期和 S3 目标，保存后生效，无需重启。补充 GitHub token 获取说明，已关联的 OIDC 不再重复提示绑定，并显示验证后的账号名称。同一数据目录仅允许一个服务端；恢复密钥仍需单独准备，完整恢复尚未交付。沿用原账号、主密钥与数据目录；仅发布喵喵商店。'
images: []
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Cognate
    summary: Skill 聚合、分发与同步服务
