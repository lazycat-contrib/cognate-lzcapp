version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/cognate.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git
build:
  toolchains:
    - kind: go
      version: 1.27.3
    - kind: node
      version: 26.12.0
  run_buildscript: true
release:
  use_github_release_notes: false
  store_changelog_format: plain
  changelog_template: 'Cognate {{.Version}}：密码登录后使用 OIDC 默认关联当前账号，支持密码确认取消关联并退出其它会话，不自动合并历史账号。Web 支持 Magpie 界面密码加密导出，密码仅在浏览器解密，仅迁移技能来源，不恢复打包文件或全部配置。cc-switch Web 快照支持 schema23/24 与 64 MiB。沿用原管理员、密码、主密钥和数据目录；平台 OIDC 与真机升级待验证。仅喵喵商店分发，官方关闭。'
images: []
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Cognate
    summary: Skill 聚合、分发与同步服务
