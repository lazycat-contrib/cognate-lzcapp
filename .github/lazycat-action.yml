version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/cognate.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git
build:
  toolchains:
    - kind: go
      version: 1.27.3
    - kind: node
      version: 26.12.0
  run_buildscript: true
release:
  use_github_release_notes: false
  store_changelog_format: plain
  changelog_template: 'Cognate {{.Version}}：登录与公开目录增加克制的局部追光和渐入，支持减少动态效果与键盘操作。导入及仓库搜索支持一键清空、焦点保留和明确的筛选计数。备份设置明确区分草稿与已同步状态，重新读取前确认，防止旧读取覆盖新设置并恢复键盘焦点；保存在线生效，无需重启。随包保留 React Bits 完整许可。沿用原账号、主密钥与数据目录，仅发布喵喵商店。'
images: []
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Cognate
    summary: Skill 聚合、分发与同步服务
