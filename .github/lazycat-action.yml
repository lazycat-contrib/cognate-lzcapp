version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/cognate.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git
build:
  toolchains:
    - kind: go
      version: 1.27.3
    - kind: node
      version: 26.12.0
  run_buildscript: true
release:
  use_github_release_notes: false
  store_changelog_format: plain
  changelog_template: 'Cognate {{.Version}}：更新至服务端 0.3.0，新增 Linux 离线单归档修复，可从可信本机备份补回缺失归档或替换损坏归档，并保留损坏原件；中断后可按修复 ID 检查和显式续接。须先停止服务，不自动下载、删除或回收文件，不代表完整备份恢复。沿用原管理员密码、主密钥和私有数据目录；平台 OIDC 与真机升级仍待验证。仅喵喵商店分发，官方商店关闭。'
images: []
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Cognate
    summary: Skill 聚合、分发与同步服务
