version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/cognate.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git
build:
  toolchains:
    - kind: go
      version: 1.27.3
    - kind: node
      version: 26.12.0
  run_buildscript: true
release:
  use_github_release_notes: false
  store_changelog_format: plain
  changelog_template: 'Cognate {{.Version}}：新增 cc-switch schema23/24 OpenCode v1 配置选择导入，完整审阅 provider、模型、精确上下文与凭据槽。来源密钥和 header 原值不迁移，保存后独立补充，不自动应用设备。v2 和扩展字段仍明确拒绝；桌面和 CLI 导入须配套升级。沿用原管理员、OIDC、主密钥与数据目录。仅喵喵商店，官方关闭，真机升级待验证。'
images: []
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Cognate
    summary: Skill 聚合、分发与同步服务
