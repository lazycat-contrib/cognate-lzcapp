name: LazyCat Exec package
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified LPK to GitHub and MiaoMiao
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: lazycat-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lazycat:
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      operation: auto
      config: .github/lazycat-action.yml
      dry-run: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.publish) }}
      versioned-release-asset: true
      toolchains: go,node
      go-version: 1.27.3
      node-version: 26.12.0
    secrets:
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
  mark-preview:
    needs: lazycat
    if: startsWith(github.ref, 'refs/tags/v') && (contains(github.ref_name, '-rc.') || contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.'))
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Keep preview releases out of latest
        run: gh release edit "$RELEASE_TAG" --prerelease --latest=false
